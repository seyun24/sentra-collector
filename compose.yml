# Reference only. Run install.sh to generate mounts from collector.env.
name: sentra-collector
services:
  collector:
    image: ghcr.io/seyun24/sentra-collector:v0.1.0
    env_file:
      - path: ./collector.env
        format: raw
    environment:
      SENTRA_COLLECTOR_DEV_MODE: "false"
      SENTRA_COLLECTOR_EXEC_ENABLED: "false"
      SENTRA_COLLECTOR_HOST_ROOT: /sentra-unmounted-host
      SENTRA_COLLECTOR_LOG_STATE_PATH: /var/lib/sentra/state/log.json
      SENTRA_COLLECTOR_TRACE_STATE_PATH: /var/lib/sentra/state/trace.json
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m]
    volumes:
      - collector-state:/var/lib/sentra/state
volumes:
  collector-state:
